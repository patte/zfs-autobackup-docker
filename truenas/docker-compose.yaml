# zfs-autobackup as a TrueNAS Custom App
#
# TrueNAS UI: Apps -> Discover Apps -> (three dots, top right) -> Install via YAML
#   1. Adjust the settings below.
#   2. Paste the whole file, install.
#   3. The app logs show its ssh public key: add it to authorized_keys on the ssh target.
#      With run_on_startup the first backup runs right away, the logs show whether it works.
#
# See https://github.com/patte/zfs-autobackup-docker#truenas

x-settings:
  # Name of this backup job: datasets with the ZFS property autobackup:<name>=true are
  # backed up, snapshots are named <name>-<timestamp>.
  backup_name: &backup_name offsite
  # Datasets to back up (comma separated, child datasets are included). The property is set
  # on every start, never unset (zfs inherit autobackup:<name> <dataset> to remove one).
  datasets: &datasets tank/photos,tank/documents
  # Where the backups go: user@host of the ssh target and the dataset to receive under.
  ssh_target: &ssh_target user@backup.example.com
  target_path: &target_path backup/truenas
  # Dataset (mountpoint) on this TrueNAS for the app's state: ssh key, known_hosts, ssh config.
  # Create it under Datasets first, e.g. tank/apps/zfs-autobackup.
  config_dir: &config_dir /mnt/tank/apps/zfs-autobackup
  # When to run (cron expression) and in which timezone.
  schedule: &schedule "0 3 * * *"
  timezone: &timezone Europe/Zurich
  # Thinning: keep the last 10 snapshots, then 1 per day for a week, 1 per week for a month,
  # 1 per month for a year. See https://github.com/psy0rz/zfs_autobackup/wiki/Thinner
  keep_source: &keep_source 10,1d1w,1w1m,1m1y
  keep_target: &keep_target 10,1d1w,1w1m,1m1y
  # Optional: healthchecks.io style monitoring URL, alerts on failed and on missing runs.
  ping_url: &ping_url ""

services:
  # Prepares the config dataset before every start: ssh key (generated once), ssh config with
  # host key pinning, autobackup property on the datasets, ssh connection check.
  zfs-autobackup-init:
    image: ghcr.io/patte/zfs-autobackup:3
    entrypoint: ["/bin/bash", "/init.sh"]
    restart: on-failure:1
    cap_drop: [ALL]
    cap_add: [SYS_ADMIN, CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges=true]
    devices:
      - /dev/zfs:/dev/zfs
    environment:
      SSH_DIR: /config/ssh
      # accept-new: pin the host key on the first connection. yes: only connect to hosts
      # already in <config_dir>/ssh/known_hosts.
      STRICT_HOST_KEY_CHECKING: accept-new
      AUTOBACKUP_NAME: *backup_name
      AUTOBACKUP_DATASETS: *datasets
      SSH_HOSTS: *ssh_target
    volumes:
      - type: bind
        source: *config_dir
        target: /config
    configs:
      - source: init_script
        target: /init.sh
        mode: 0755

  zfs-autobackup:
    image: ghcr.io/patte/zfs-autobackup:3
    restart: unless-stopped
    depends_on:
      zfs-autobackup-init:
        condition: service_completed_successfully
    cap_drop: [ALL]
    cap_add: [SYS_ADMIN]
    security_opt: [no-new-privileges=true]
    devices:
      - /dev/zfs:/dev/zfs
    # Unhealthy (TrueNAS shows the app as "Deploying") after two failed runs in a row.
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 1
      start_period: 15s
    stop_grace_period: 60s
    environment:
      TZ: *timezone
      CRON_SCHEDULE: *schedule
      # Also run once when the app starts.
      RUN_ON_STARTUP: "true"
      PING_URL: *ping_url
    volumes:
      - type: bind
        source: *config_dir
        target: /config
    # zfs-autobackup arguments, see https://github.com/psy0rz/zfs_autobackup/wiki/Manual
    command:
      - --ssh-config
      - /config/ssh/config
      - -v
      - --ssh-target
      - *ssh_target
      - --strip-path
      - "1"
      - --keep-source
      - *keep_source
      - --keep-target
      - *keep_target
      - *backup_name
      - *target_path

configs:
  init_script:
    # Note: "$$" is a literal "$" (docker compose interpolates "$" in this file).
    content: |
      #!/bin/bash
      set -euo pipefail
      log() { echo "[init] $$*"; }
      d="$$SSH_DIR"
      # zfs-autobackup runs as root without DAC_OVERRIDE, so the ssh dir must be root-owned
      mkdir -p "$$d" && chown -R 0:0 "$$d" && chmod 700 "$$d"

      if ! compgen -G "$$d/id_*" >/dev/null; then
        log "generating ssh key $$d/id_ed25519"
        ssh-keygen -q -t ed25519 -N '' -C "zfs-autobackup@truenas" -f "$$d/id_ed25519"
      fi
      for key in "$$d"/id_*; do
        [[ "$$key" == *.pub || ! -f "$$key" ]] && continue
        chmod 600 "$$key"
        [[ -f "$$key.pub" ]] && log "ssh public key ($$key.pub), add it to the authorized_keys on the ssh target/source:" && echo && cat "$$key.pub" && echo
      done
      touch "$$d/known_hosts"

      {
        echo "Host *"
        echo "    ServerAliveInterval 60"
        echo "    ServerAliveCountMax 15"
        echo "    ControlMaster auto"
        echo "    ControlPath /root/.ssh/cm-%r@%h:%p"
        echo "    ControlPersist 48h"
        echo "    StrictHostKeyChecking $$STRICT_HOST_KEY_CHECKING"
        echo "    UserKnownHostsFile $$d/known_hosts"
        for key in "$$d"/id_*; do
          [[ "$$key" == *.pub || ! -f "$$key" ]] && continue
          echo "    IdentityFile $$key"
        done
      } > "$$d/config"

      for ds in $${AUTOBACKUP_DATASETS//,/ }; do
        if zfs set "autobackup:$$AUTOBACKUP_NAME=true" "$$ds"; then
          log "set autobackup:$$AUTOBACKUP_NAME=true on $$ds"
        else
          log "warning: could not set autobackup:$$AUTOBACKUP_NAME on $$ds"
        fi
      done

      for host in $${SSH_HOSTS//,/ }; do
        if out=$$(ssh -F "$$d/config" -o BatchMode=yes -o ConnectTimeout=15 "$$host" true 2>&1); then
          log "ssh connection to $$host ok"
        else
          rc=$$?
          out=$$(grep -v '^Warning: Permanently added' <<<"$$out" || true)
          log "warning: ssh connection to $$host failed: $${out:-exit code $$rc}"
        fi
      done
