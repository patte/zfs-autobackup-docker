name: test

on:
  pull_request:
  workflow_call:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install zfs and sshd
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zfsutils-linux openssh-server
          sudo modprobe zfs
          sudo systemctl start ssh
          zfs version

      - name: Validate TrueNAS compose file
        run: docker compose -f truenas/docker-compose.yaml config --quiet

      - name: Build image
        run: docker build -t zfs-autobackup:test .

      - name: Run integration tests
        run: sudo tests/integration.sh zfs-autobackup:test
